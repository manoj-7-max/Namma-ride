name: Phase 3 Android debug APKs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/customer/**'
      - 'apps/driver/**'
      - '.github/workflows/android-apks.yml'

permissions:
  contents: read

jobs:
  customer-apk:
    runs-on: ubuntu-latest
    env:
      PILOT_API_BASE_URL: ${{ vars.PILOT_API_BASE_URL || 'https://pilot-api.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/customer
      - run: flutter build apk --debug --flavor pilot --dart-define=API_BASE_URL=${PILOT_API_BASE_URL}
        working-directory: apps/customer
      - uses: actions/upload-artifact@v4
        with:
          name: namma-ride-customer-debug-apk
          path: apps/customer/build/app/outputs/flutter-apk/app-pilot-debug.apk
          if-no-files-found: error
          retention-days: 14

  driver-apk:
    runs-on: ubuntu-latest
    env:
      PILOT_API_BASE_URL: ${{ vars.PILOT_API_BASE_URL || 'https://pilot-api.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/driver
      - run: flutter build apk --debug --flavor pilot --dart-define=API_BASE_URL=${PILOT_API_BASE_URL}
        working-directory: apps/driver
      - uses: actions/upload-artifact@v4
        with:
          name: namma-ride-driver-debug-apk
          path: apps/driver/build/app/outputs/flutter-apk/app-pilot-debug.apk
          if-no-files-found: error
          retention-days: 14
