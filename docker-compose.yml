name: namma-ride
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER}
      EXPOSE_TEST_OTP: ${EXPOSE_TEST_OTP:-false}
      MATCHING_RADIUS_KM: ${MATCHING_RADIUS_KM:-8}
      LOCATION_MAX_AGE_SECONDS: ${LOCATION_MAX_AGE_SECONDS:-120}
      LOCATION_MAX_ACCURACY_M: ${LOCATION_MAX_ACCURACY_M:-100}
      LOCATION_MIN_INTERVAL_SECONDS: ${LOCATION_MIN_INTERVAL_SECONDS:-5}
      DISPATCH_OFFER_SECONDS: ${DISPATCH_OFFER_SECONDS:-30}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["${API_BIND_HOST:-127.0.0.1}:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
